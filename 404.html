<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Green Mart Nagpur</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="images/branding/green-mart-favicon.png">
<meta name="theme-color" content="#1B5E3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#1B5E3A; --leaf:#3FA060; --foam:#F7FAF7; --ink:#0E3B33;
  --display:'Fraunces',serif; --body:'Outfit',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);color:var(--ink);background:var(--foam);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.logo{width:64px;height:64px;margin-bottom:18px}
h1{font-family:var(--display);font-size:clamp(3rem,10vw,5rem);color:var(--pine);line-height:1;margin-bottom:8px}
.fish{font-size:2.2rem;margin-bottom:14px;display:inline-block;animation:swim 2.4s ease-in-out infinite}
@keyframes swim{0%,100%{transform:translateX(0) rotate(0deg)}50%{transform:translateX(-14px) rotate(4deg)}}
h2{font-family:var(--display);font-size:1.5rem;margin-bottom:10px}
p{color:#3d5a52;max-width:26rem;margin-bottom:28px;line-height:1.6}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:999px;font-weight:600;font-size:.95rem;text-decoration:none;transition:transform .15s ease}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:var(--pine);color:#fff}
.btn-wa{background:#25D366;color:#fff}
.btn-ghost{background:#fff;color:var(--pine);border:2px solid var(--pine)}
</style>
</head>
<body>
  <img src="images/branding/green-mart-logo.png" alt="Green Mart logo" class="logo">
  <span class="fish">🐟</span>
  <h1>404</h1>
  <h2>Looks like this one got away.</h2>
  <p>The page you're looking for isn't here — it may have moved, or the link might be off. Let's get you back on course.</p>
  <div class="btn-row">
    <a href="/" class="btn btn-primary">🏠 Back to Homepage</a>
    <a href="/#products" class="btn btn-ghost">🐟 See Products</a>
    <a href="https://wa.me/918600632420?text=Hi%20Green%20Mart!%20I%20got%20a%20broken%20link%20on%20your%20site." class="btn btn-wa" target="_blank">💬 Tell us on WhatsApp</a>
  </div>
</body>
</html>
